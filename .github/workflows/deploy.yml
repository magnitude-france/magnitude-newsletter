name: Deploy Magnitude (Observable Framework) to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy static numero assets (deep dives, numero pages)
        # Observable Framework only auto-copies files it detects as
        # referenced via <img>/<link>/<audio>/<video> attributes (or an
        # explicit FileAttachment() call) at build time -- plain <a href>
        # links (our "Lire le deep dive" / "Voir le numéro complet"
        # links) are treated purely as internal page-routing hints and
        # never trigger a file copy. Without this step, the .html report
        # pages under src/numeros/ never end up in dist/, so those links
        # 404 on the deployed site even though the charts (referenced via
        # <img src>) build correctly on their own.
        run: cp -r src/numeros dist/numeros

      - name: Copy static special editions (same reason as above)
        # src/editions-speciales/<slug>/analyse.html est une page HTML
        # autonome liée par un simple <a href> depuis la home : sans cette
        # copie explicite, elle n'arrive pas dans dist/ et renvoie 404.
        run: cp -r src/editions-speciales dist/editions-speciales

      - name: Copy static charter pages (same reason as above)
        # charte-ton-style.html and charte-selection-sujets.html are only
        # ever linked via plain <a href> (from the deep dive pages and
        # from each other), so they hit the same Observable Framework
        # limitation described above and need an explicit copy too.
        run: cp src/charte-ton-style.html src/charte-selection-sujets.html dist/

      - name: Copy stable public assets (candidate icons, logo)
        # Observable Framework copies the files it detects in .md pages to
        # hashed paths (/_file/candidats/x.<hash>.png), so /candidats/x.png
        # would 404. The raw .html pages (numero-0, analyses), the favicon
        # and the newsletter emails (which cannot know the hash) reference
        # the stable URLs https://magnitude.pub/candidats/<slug>.png and
        # /magnitude-icon.png : copy them explicitly, same reason as above.
        run: |
          cp -r src/candidats dist/candidats
          cp src/magnitude-icon.png dist/magnitude-icon.png

      - name: Publish the deck as the home page (magnitude.pub) and at /deck
        # prototypes/deck/deck.html est un fichier HTML autonome (aucune
        # requête réseau). Depuis le 2026-10-24 (décision de Guilhem), il
        # devient la page d'accueil. L'ancienne accueil Observable
        # (src/index.md) reste servie à /newsletter : même dossier que
        # l'accueil, donc ses liens et ressources relatifs restent valides.
        # /deck/ reste servi (noindex) pour les liens déjà partagés.
        run: |
          ENTETE='<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="/magnitude-icon.png">'
          mkdir -p dist/deck
          { printf '%s' "$ENTETE" '<meta name="robots" content="noindex">'; cat prototypes/deck/deck.html; } > dist/deck/index.html
          mv dist/index.html dist/newsletter.html
          { printf '%s' "$ENTETE" '<meta name="description" content="Magnitude, présidentielle 2027 : une mesure par carte, un chiffre sourcé. Vos choix dessinent la galaxie des candidats dont vous êtes le plus proche.">'; cat prototypes/deck/deck.html; } > dist/index.html

      - name: Copy CNAME (custom domain magnitude.pub)
        run: cp CNAME dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
