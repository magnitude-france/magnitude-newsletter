name: Deploy Magnitude (Observable Framework) to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy static numero assets (deep dives, numero pages)
        # Observable Framework only auto-copies files it detects as
        # referenced via <img>/<link>/<audio>/<video> attributes (or an
        # explicit FileAttachment() call) at build time -- plain <a href>
        # links (our "Lire le deep dive" / "Voir le numéro complet"
        # links) are treated purely as internal page-routing hints and
        # never trigger a file copy. Without this step, the .html report
        # pages under src/numeros/ never end up in dist/, so those links
        # 404 on the deployed site even though the charts (referenced via
        # <img src>) build correctly on their own.
        run: cp -r src/numeros dist/numeros

      - name: Copy CNAME (custom domain magnitude.pub)
        run: cp CNAME dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
