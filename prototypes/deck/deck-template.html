<title>Magnitude — La Pioche Politique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout : appli plein écran — en-tête, scène de carte, pavé de 4 gestes, barre d'onglets.
   La couleur du deck (--deck) pilote cadre, halo, onglets ; elle glisse d'une maison à l'autre. */
@property --deck-h { syntax: '<number>'; inherits: true; initial-value: 200; }
@property --deck-c { syntax: '<number>'; inherits: true; initial-value: 0.085; }
@property --deck-l { syntax: '<number>'; inherits: true; initial-value: 0.53; }
:root {
  /* Design system Magnitude (inchangé) */
  --page: #F1F8F8; --surface: #FFFFFF; --surface-2: #EEF8F7;
  --ink: #0B1F22; --ink-2: #3E5558; --muted: #5F7679; --line: rgba(11,74,82,.14);
  --teal-100: #DDF2F0; --teal-700: #137A7F; --teal-900: #0B4A52;
  --amber: #D97706; --amber-pale: #FEF3C7; --link: #0A58CA;
  /* Décisions : jamais rouge/vert (lecture partisane, daltonisme) */
  --d-ok: #137A7F; --d-no: #B45309; --d-wish: #0A58CA; --d-meh: #6B7F82;
  --dossier: #FBF3DF; --dossier-edge: #E7D3A6;
  --lift: 0; --on-deck: #FFFFFF;
  --deck: oklch(calc(var(--deck-l) + var(--lift)) var(--deck-c) var(--deck-h));
  --deck-soft: color-mix(in oklab, var(--deck) 14%, var(--surface));
  --serif: "Literata", "Iowan Old Style", Georgia, serif;  /* lecture (passe 7) */
  --display: "IM Fell English", "Iowan Old Style", Georgia, serif;  /* grands titres seulement */
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --top-h: 52px; --tabs-h: 62px;
  transition: --deck-h 1100ms ease, --deck-c 1100ms ease, --deck-l 1100ms ease;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #071A1D; --surface: #0E2A2E; --surface-2: #12343A;
    --ink: #E6F2F1; --ink-2: #B9CFD0; --muted: #8DA8AA; --line: rgba(221,242,240,.14);
    --teal-100: #12343A; --teal-700: #4FC1BC; --teal-900: #DDF2F0;
    --amber: #F59E0B; --amber-pale: #3A2A0B; --link: #7DB2FF;
    --d-ok: #4FC1BC; --d-no: #F0A04B; --d-wish: #7DB2FF; --d-meh: #9AB0B2;
    --dossier: #2A2416; --dossier-edge: #5A4A26;
    --lift: 0.12; --on-deck: #04191C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #071A1D; --surface: #0E2A2E; --surface-2: #12343A;
  --ink: #E6F2F1; --ink-2: #B9CFD0; --muted: #8DA8AA; --line: rgba(221,242,240,.14);
  --teal-100: #12343A; --teal-700: #4FC1BC; --teal-900: #DDF2F0;
  --amber: #F59E0B; --amber-pale: #3A2A0B; --link: #7DB2FF;
  --d-ok: #4FC1BC; --d-no: #F0A04B; --d-wish: #7DB2FF; --d-meh: #9AB0B2;
  --dossier: #2A2416; --dossier-edge: #5A4A26;
  --lift: 0.12; --on-deck: #04191C; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
:root { --st-win: color-mix(in oklab, var(--amber) 62%, var(--ink)); }  /* sinon .view{display:flex} empile les onglets masqués */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { height: 100%; display: flex; flex-direction: column; }
.top { flex: none; height: var(--top-h); display: flex; align-items: center; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 3px solid var(--deck); background: var(--surface); }
.top svg.logo { width: 26px; height: 26px; flex: none; }
.brand { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; flex: 1 1 auto; }
.brand b { font-family: var(--serif); font-size: 16px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.brand span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.week { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--deck); }
.dots i.on { background: var(--deck); }

main { flex: 1; min-height: 0; position: relative; overflow: hidden; }  /* une carte jetée hors écran n'élargit pas la page */
.view { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 16px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }

/* Bascule Jouer / Mon deck */
.seg { flex: none; display: flex; gap: 4px; margin: 10px auto 0; padding: 4px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* Scène */
#play { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.stage { flex: 1; min-height: 0; position: relative; container-type: size; margin: 10px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.halo { position: absolute; inset: 6% 4%; border-radius: 40px; background: radial-gradient(closest-side, color-mix(in oklab, var(--deck) 30%, transparent), transparent); filter: blur(18px); pointer-events: none; }
.card { position: absolute; left: 50%; top: 50%; width: min(calc(100cqw - 8px), calc((100cqh - 8px) * 0.714)); aspect-ratio: 5 / 7; translate: -50% -50%; container-type: size; touch-action: none; user-select: none; -webkit-user-select: none; will-change: transform; }
.card.next { transform: scale(.94) translateY(3%); filter: saturate(.8); opacity: .85; pointer-events: none; }
.card.anim { transition: transform 280ms cubic-bezier(.2,.8,.2,1), opacity 280ms ease; }
.frame { position: absolute; inset: 0; border-radius: 6cqw; background: var(--deck); padding: 2.4cqw; box-shadow: 0 18px 40px -18px rgba(5,40,44,.55), 0 2px 6px rgba(5,40,44,.18); }
.inner { box-sizing: border-box; height: 100%; border-radius: 4.4cqw; background: var(--surface); display: flex; flex-direction: column; gap: 2.2cqh; padding: 4cqw; overflow: hidden; position: relative; }
.c-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px; border-radius: 999px; background: var(--deck-soft); color: var(--ink); font-size: clamp(10px, 3.4cqw, 13px); font-weight: 600; }
.chip svg { width: 1.3em; height: 1.3em; }
.num { font-family: var(--mono); font-size: clamp(10px, 3.2cqw, 12px); color: var(--muted); letter-spacing: .06em; }
.fig { display: flex; align-items: baseline; gap: 3cqw; }
.fig b { font-family: var(--serif); font-size: clamp(22px, 10cqw, 40px); line-height: 1; color: var(--deck); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fig span { font-size: clamp(10px, 3.3cqw, 13px); color: var(--ink-2); line-height: 1.3; }
.c-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 2cqh; font-size: clamp(9px, 2.8cqw, 11px); color: var(--muted); }
.info-btn { display: inline-flex; align-items: center; gap: 5px; border: 1.5px solid var(--deck); color: var(--deck); background: var(--surface); border-radius: 999px; padding: .35em .85em; font: inherit; font-weight: 700; letter-spacing: .02em; cursor: pointer; }
.info-btn svg { width: 1.25em; height: 1.25em; }
.fiche .kick { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.fiche h3 { font-family: var(--serif); font-size: 21px; line-height: 1.25; margin: 2px 0 0; }
.fiche h3:focus { outline: none; }
.fiche h4 { margin: 4px 0 0; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--deck); }
.fiche p { margin: 0; line-height: 1.5; }
.fiche .ess { font-size: 15.5px; }
.fiche .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.fiche .kpi { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.fiche .kpi b { font-family: var(--serif); font-size: 22px; color: var(--deck); }
.fiche .kpi span { font-size: 12px; color: var(--ink-2); line-height: 1.35; }
.eu { display: grid; gap: 9px; }
.eu .ttl { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.eu .bar-row { display: grid; grid-template-columns: minmax(0, 8.5em) 1fr 5.6em; gap: 8px; align-items: center; font-size: 13px; }
.eu .bar-row .lb { overflow-wrap: anywhere; line-height: 1.2; }
.eu .bar-row.focus .lb { font-weight: 700; }
.eu .track { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; }
.eu .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: color-mix(in oklab, var(--muted) 55%, var(--surface)); }
.eu .bar-row.focus .fill { background: var(--deck); }
.eu .range { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: repeating-linear-gradient(45deg, transparent 0 3px, color-mix(in oklab, var(--muted) 45%, transparent) 3px 5px); }
.eu .refline { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--d-no); }
.eu .val { font-family: var(--mono); font-size: 12px; white-space: nowrap; text-align: right; }
.eu .legend { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.eu .legend i { display: inline-block; width: 2px; height: 12px; background: var(--d-no); }
.eu details { font-size: 12px; color: var(--muted); }
.eu details li { margin: 3px 0; }
.fiche .srcs { margin: 0; padding-left: 18px; font-size: 12.5px; display: grid; gap: 4px; }
.fiche .anon { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; display: flex; gap: 8px; align-items: flex-start; }
.stamp { position: absolute; z-index: 3; padding: 4px 12px; border: 3px solid currentColor; border-radius: 8px; font-family: var(--sans); font-weight: 800; letter-spacing: .08em; font-size: clamp(14px, 6cqw, 24px); text-transform: uppercase; opacity: 0; pointer-events: none; background: color-mix(in oklab, var(--surface) 85%, transparent); }
.stamp.r { top: 9%; left: 7%; color: var(--d-ok); rotate: -12deg; }
.stamp.l { top: 9%; right: 7%; color: var(--d-no); rotate: 12deg; }
.stamp.u { bottom: 14%; left: 50%; translate: -50% 0; color: var(--d-wish); }
.stamp.d { top: 30%; left: 50%; translate: -50% 0; color: var(--d-meh); }

.pad { flex: none; display: flex; justify-content: center; gap: 14px; padding: 4px 16px 30px; }
.pad button { width: 58px; display: grid; justify-items: center; gap: 3px; border: 0; background: none; font-size: 11px; color: var(--ink-2); font-weight: 600; }
.pad .b { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid currentColor; box-shadow: 0 4px 12px -6px rgba(0,0,0,.35); transition: transform 120ms ease; }
.pad button:active .b { transform: scale(.92); }
.pad .b svg { width: 22px; height: 22px; }
.pad .no { color: var(--d-no); } .pad .ok { color: var(--d-ok); } .pad .wish { color: var(--d-wish); } .pad .meh { color: var(--d-meh); }
.pad button span:last-child { color: var(--ink-2); }
.done { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
.done h2 { font-family: var(--serif); font-size: 24px; margin: 0 0 6px; }

/* Mon deck */
.deckhero { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.swatch { width: 96px; aspect-ratio: 5/7; border-radius: 12px; background: linear-gradient(160deg, color-mix(in oklab, var(--deck) 55%, var(--surface)), var(--deck)); display: grid; place-items: center; box-shadow: inset 0 0 0 3px color-mix(in oklab, var(--surface) 40%, transparent); }
.swatch img { width: 64px; height: 64px; border-radius: 50%; box-shadow: 0 0 0 3px var(--surface); }
.deckhero h2 { font-family: var(--serif); font-size: 21px; margin: 0; line-height: 1.2; text-wrap: balance; }
.deckhero p { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
h3 { font-family: var(--serif); font-size: 18px; margin: 0; }
.rank { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.row { display: grid; grid-template-columns: 22px 28px minmax(0, 1fr) 54px; align-items: center; gap: 8px; font-size: 13px; }
.row .pos { font-family: var(--mono); color: var(--muted); font-size: 12px; text-align: right; }
.row img { width: 28px; height: 28px; border-radius: 50%; }
.row .nm { display: grid; gap: 3px; min-width: 0; }
.row .nm b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; transition: width 600ms ease; }
.bar.weak i { background: repeating-linear-gradient(135deg, var(--muted) 0 3px, transparent 3px 6px) !important; }
.row .pct { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.row .pct small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.row.lead .nm b::after { content: " · maison"; color: var(--deck); font-weight: 700; }
.note { font-size: 12.5px; color: var(--ink-2); background: var(--amber-pale); border-radius: 12px; padding: 10px 12px; border-left: 4px solid var(--amber); }
.coll { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mini { border: 0; text-align: left; background: var(--surface); border-radius: 12px; padding: 8px; display: grid; gap: 4px; box-shadow: inset 0 0 0 2px var(--deck-soft); min-width: 0; }
.mini.todo { box-shadow: inset 0 0 0 1.5px var(--line); background: transparent; border: 1.5px dashed var(--line); }
.mini svg { width: 20px; height: 20px; stroke: var(--deck); }
.mini .t { font-size: 11.5px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; width: fit-content; }
.badge.ok { color: var(--d-ok); background: color-mix(in oklab, var(--d-ok) 14%, transparent); }
.badge.no { color: var(--d-no); background: color-mix(in oklab, var(--d-no) 14%, transparent); }
.badge.wish { color: var(--d-wish); background: color-mix(in oklab, var(--d-wish) 14%, transparent); }
.badge.meh { color: var(--d-meh); background: color-mix(in oklab, var(--d-meh) 16%, transparent); }
.badge.todo { color: var(--muted); border: 1px dashed var(--line); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; }
.btn.primary { background: var(--deck); color: var(--on-deck); border-color: transparent; }
.btn.ghost { background: transparent; }

/* Onglets */
.tabs { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); height: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); background: var(--surface); border-top: 1px solid var(--line); }
.tabs button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; font-family: var(--serif); font-size: 13px; font-weight: 700; letter-spacing: .01em; color: var(--muted); position: relative; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-selected="true"] { color: var(--deck); }
.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--deck); }
.tabs .tab-deck { align-content: start; gap: 2px; padding: 0; }
.tabs .tab-deck::before { display: none; }
.tabs .orb { width: 54px; height: 54px; margin-top: -24px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, color-mix(in oklab, var(--deck) 35%, #06262a), #04191c 72%); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px color-mix(in oklab, var(--deck) 45%, transparent), 0 10px 22px -10px rgba(5,40,44,.7); transition: box-shadow 200ms ease; }
.tabs .tab-deck[aria-selected="true"] .orb { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--deck), 0 0 22px -2px color-mix(in oklab, var(--deck) 70%, transparent); }
.tabs .orb canvas { width: 50px; height: 50px; border-radius: 50%; }
.tabs .tab-deck:focus-visible { outline: none; } .tabs .tab-deck:focus-visible .orb { outline: 3px solid var(--d-wish); outline-offset: 3px; }

/* Recherche — esthétique bureau d'enquête */
.case-head { display: flex; align-items: center; gap: 10px; }
.case-head svg { width: 34px; height: 34px; stroke: var(--ink); }
.case-head h2 { font-family: var(--serif); font-size: 24px; margin: 0; }
.case-head p { margin: 0; font-family: var(--mono); font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 8px 12px; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-family: var(--mono); font-size: 14px; color: var(--ink); }
.search svg { width: 20px; height: 20px; stroke: var(--ink); flex: none; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.dossier { position: relative; background: var(--dossier); border: 1px solid var(--dossier-edge); border-radius: 4px 12px 12px 12px; padding: 14px 14px 12px; display: grid; gap: 6px; margin-top: 34px; }
.dossier::before { content: attr(data-tab); position: absolute; top: -21px; left: -1px; height: 20px; padding: 0 12px; display: flex; align-items: center; background: var(--dossier); border: 1px solid var(--dossier-edge); border-bottom: 0; border-radius: 8px 8px 0 0; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; color: var(--ink-2); }
.dossier h4 { margin: 0; padding-right: 92px; font-family: var(--serif); font-size: 16px; line-height: 1.3; text-wrap: balance; }
.dossier .meta { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.redact { background: var(--ink); color: transparent; border-radius: 2px; padding: 0 .3em; user-select: none; }
.dossier .stampd { position: absolute; right: 10px; top: 8px; rotate: 8deg; font-family: var(--mono); font-weight: 800; font-size: 10.5px; letter-spacing: .1em; border: 2px solid currentColor; padding: 1px 6px; border-radius: 4px; }

/* La Maison Magnitude — l'atelier des données (parchemin et plume, comme Deck et Recherche) */
.mai-wrap { gap: 20px; padding-top: 22px; padding-bottom: 40px; }
.mai-head { display: grid; justify-items: center; gap: 2px; }
.mai-head .hat-mark { width: 70px; height: 70px; margin-bottom: 2px; }
.mai-intro { margin: 0; text-align: center; font-family: var(--fell); font-size: 16px; line-height: 1.5; color: var(--iron); text-wrap: pretty; }
.mai-sec { padding: 18px 18px 16px; display: grid; gap: 12px; }
.mai-sec h3 { font-family: var(--fell); font-weight: 400; font-size: 23px; margin: 0; line-height: 1.1; }
.mai-sec .rubric { font-family: var(--fell); font-style: italic; font-size: 13.5px; color: var(--iron-2); margin: 0; line-height: 1.45; }
.kfig { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kfig div { display: grid; align-content: start; text-align: center; padding: 0 4px; border-right: 1px solid var(--rule); }
.kfig div:last-child { border-right: 0; }
.kfig b { font-family: var(--plume); font-weight: 400; font-size: 30px; line-height: 1.15; color: var(--deck); white-space: nowrap; }
.kfig span { font-family: var(--fell); font-style: italic; font-size: 12.5px; color: var(--iron-2); line-height: 1.25; }
.mx { display: grid; grid-template-columns: 2.1em repeat(12, minmax(0, 1fr)); gap: 4px 1px; align-items: center; }
.mx img { width: 100%; max-width: 24px; aspect-ratio: 1; border-radius: 50%; justify-self: center; }
.mx img.retire { filter: grayscale(1); opacity: .5; }
.mx .rl { font-family: var(--fell); font-size: 12px; color: var(--iron-2); text-align: right; padding-right: 5px; white-space: nowrap; }
.mx .rl.ready { color: var(--deck); }
.mx .rl.ready::before { content: "✦ "; font-size: 9px; }
.mx i, .mx-leg i { justify-self: center; display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; }
.dA { background: var(--deck); }
.dB { background: color-mix(in oklab, var(--deck) 50%, var(--surface)); }
.dC { box-shadow: inset 0 0 0 1.8px color-mix(in oklab, var(--deck) 60%, var(--surface)); }
.mx i.dx { width: 4px; height: 4px; background: var(--rule); }
.mx-leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--fell); font-style: italic; font-size: 13px; color: var(--iron-2); }
.mx-leg span { white-space: nowrap; }
.mx-leg .ready { color: var(--deck); font-style: normal; font-size: 10px; }
.gauge { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.gauge i { height: 8px; border-radius: 4px; background: var(--rule); }
.gauge i.on { background: var(--deck); }
.mybar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--rule); }
.mybar i { display: block; height: 100%; }
.mybar .ok { background: var(--d-ok); } .mybar .no { background: var(--d-no); } .mybar .wish { background: var(--d-wish); } .mybar .meh { background: var(--d-meh); }
.myleg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--fell); font-size: 14px; color: var(--iron-2); }
.myleg b { font-weight: 400; } .myleg .ok b { color: var(--d-ok); } .myleg .no b { color: var(--d-no); } .myleg .wish b { color: var(--d-wish); } .myleg .meh b { color: var(--d-meh); }
.mai-link { justify-self: start; border: 0; background: none; padding: 2px 0; cursor: pointer; font-family: var(--fell); font-style: italic; font-size: 16px; color: var(--iron); border-bottom: 1px solid var(--gilt); }
.well { position: relative; width: 100%; max-width: 340px; aspect-ratio: 1; margin: 0 auto; border-radius: 50%; overflow: hidden; background: radial-gradient(closest-side, #0b3b42, #04191c); box-shadow: inset 0 0 0 6px color-mix(in oklab, var(--deck) 45%, #04191c), inset 0 0 40px rgba(0,0,0,.6); }
.well canvas { width: 100%; height: 100%; display: block; }
.well-cap { margin: 0; text-align: center; font-family: var(--fell); font-style: italic; font-size: 13.5px; color: var(--iron-2); }
.wl-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; }
.wl-tabs button { border: 0; background: none; padding: 3px 0; cursor: pointer; font-family: var(--fell); font-style: italic; font-size: 16px; color: var(--ink-2); border-bottom: 2px solid transparent; }
.wl-tabs button.wish { color: var(--d-wish); } .wl-tabs button.meh { color: var(--d-meh); }
.wl-tabs button[aria-pressed="true"] { border-bottom-color: currentColor; color: var(--ink); }
.wl-tabs button.wish[aria-pressed="true"] { color: var(--d-wish); } .wl-tabs button.meh[aria-pressed="true"] { color: var(--d-meh); }
.wl-list { display: grid; gap: 0; }
.wl-item { border: 0; background: none; text-align: left; cursor: pointer; display: grid; gap: 2px; padding: 10px 0; border-top: 1px solid var(--rule); font: inherit; color: var(--iron); }
.wl-item .verdict { font-family: var(--plume); font-size: 22px; line-height: 1; }
.wl-item .verdict.wish { color: var(--d-wish); } .wl-item .verdict.meh { color: var(--d-meh); }
.wl-item .titre { font-family: var(--fell); font-size: 16.5px; line-height: 1.3; }
.wl-item .billet { font-family: var(--plume); font-size: 19px; line-height: 1.3; color: var(--iron-2); }
.wl-item .nonote { font-family: var(--fell); font-style: italic; font-size: 13px; color: var(--iron-2); }
.wl-item:focus-visible { outline: 2px solid var(--deck); outline-offset: 2px; }
.wl-empty { margin: 0; text-align: center; font-family: var(--plume); font-size: 20px; line-height: 1.35; color: var(--ink-2); }
.commu ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.commu li a { font-family: var(--fell); font-size: 16.5px; color: var(--iron); text-decoration: none; border-bottom: 1px solid var(--gilt); }
.commu li span { display: block; font-family: var(--fell); font-style: italic; font-size: 13px; color: var(--iron-2); }
.commu .mail { margin: 0; font-family: var(--plume); font-size: 22px; }
.commu .mail a { color: var(--deck); }
.promise { padding: 14px 18px; display: grid; gap: 6px; font-family: var(--fell); font-size: 14px; line-height: 1.5; color: var(--iron-2); }
.promise p { margin: 0; }
.promise b { font-weight: 400; font-size: 17px; color: var(--iron); }

/* Mon deck : la galaxie grand format (le bouton central qui s'agrandit) */
.cosmos { border-radius: 22px; overflow: hidden; }
.cosmos-in { position: relative; background: radial-gradient(circle at 50% 50%, color-mix(in oklab, var(--deck) 34%, #06262a), #04191c 72%); box-shadow: inset 0 0 0 1px rgba(234,246,245,.08); }
.cosmos canvas { display: block; width: 100%; height: min(calc(100vw - 32px), 440px); touch-action: pan-y; }
.cosmos .ttl { position: absolute; left: 16px; top: 12px; font-family: var(--fell); font-size: 19px; color: #EAF6F5; pointer-events: none; }
.cosmos .sub { position: absolute; left: 16px; top: 36px; font-family: var(--fell); font-style: italic; font-size: 12.5px; color: #9ED7D3; pointer-events: none; }
.cosmos-leg { margin-top: -6px; padding: 16px 18px 14px; display: grid; gap: 12px; }
.cosmos-leg h3 { font-family: var(--fell); font-weight: 400; font-size: 21px; margin: 0; }
.cosmos-leg .li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
.cosmos-leg svg { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, color-mix(in oklab, var(--deck) 35%, #06262a), #04191c 72%); }
.cosmos-leg p { margin: 0; font-family: var(--fell); font-size: 16.5px; line-height: 1.38; color: var(--iron); text-wrap: pretty; }
.cosmos-leg p b { font-weight: 400; color: var(--deck); }
.cosmos-leg .hint { display: flex; align-items: center; gap: 8px; font-family: var(--plume); font-size: 20px; line-height: 1.2; color: var(--iron-2); border-top: 1px solid var(--rule); padding-top: 10px; }
.cosmos-leg .hint i { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px dashed var(--gilt); animation: spin 4s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
@media (prefers-reduced-motion: reduce) { .cosmos-leg .hint i { animation: none; } }
.lrow[role="button"] { cursor: pointer; }
.lrow[role="button"]:hover .nm b { color: var(--deck); }
.lrow[role="button"]:focus-visible { outline: 2px solid var(--deck); outline-offset: 2px; }
/* Feuille « les mesures du candidat » */
.cm-aff { display: grid; gap: 6px; }
.cm-aff .big { font-family: var(--serif); font-size: 26px; line-height: 1; color: var(--deck); }
.cm-aff .big small { font-family: var(--sans); font-size: 12.5px; color: var(--muted); margin-left: 6px; }
.cm-sum { display: flex; flex-wrap: wrap; gap: 6px; }
.cm-grp { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 6px 0 -4px; }
.cm-item { display: grid; gap: 5px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.cm-item:hover { border-color: var(--deck); }
.cm-item .t { font-family: var(--serif); font-size: 15.5px; line-height: 1.3; }
.cm-item .ps { font-size: 12.5px; color: var(--ink-2); }
.cm-item .ag { font-size: 12.5px; font-weight: 700; }
.cm-item .ag.yes { color: var(--d-ok); } .cm-item .ag.nope { color: var(--d-no); }

/* Feuilles et superpositions */
.scrim { position: fixed; inset: 0; background: rgba(4,20,22,.45); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.25); animation: up 260ms cubic-bezier(.2,.8,.2,1); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet .in { max-width: 600px; margin: 0 auto; display: grid; gap: 14px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.reveal-head { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: center; }
.reveal-head img { width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 0 0 3px var(--deck); }
.reveal-head h3 { font-size: 21px; }
.reveal-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

/* ---------- Carte révélée : dans le score = teinte Magnitude du candidat + reflet holographique ;
   hors score = carte sobre (décision du 15/10 : elle ne compte pas dans le calcul).
   La distinction n'apparaît qu'après la révélation : le recto reste anonyme.
   Holographie générique (arc-en-ciel, paillettes, reflet) : aucun élément propre à un jeu existant. ---------- */
@property --rc-h { syntax: '<number>'; inherits: true; initial-value: 200; }
@property --rc-c { syntax: '<number>'; inherits: true; initial-value: 0.085; }
@property --rc-l { syntax: '<number>'; inherits: true; initial-value: 0.53; }
.reveal-head.rv { grid-template-columns: 112px 1fr; align-items: start; }
.rc { --rc-h: var(--rc-hue, 200); --rc-c: 0.12; --rc-l: 0.56;
  --rc: oklch(calc(var(--rc-l) + var(--lift)) var(--rc-c) var(--rc-h));
  position: relative; box-sizing: border-box; width: 112px; aspect-ratio: 5 / 7; border-radius: 12px; overflow: hidden; isolation: isolate;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; justify-items: center; align-items: center; padding: 7px 7px 8px; color: #fff;
  background: linear-gradient(160deg, color-mix(in oklab, var(--rc) 78%, #fff), var(--rc) 50%, color-mix(in oklab, var(--rc) 72%, #000));
  box-shadow: 0 12px 26px -14px rgba(5,40,44,.7), inset 0 0 0 1.5px rgba(255,255,255,.4);
  transform: perspective(520px) rotateX(var(--ry, 0deg)) rotateY(var(--rx, 0deg)); transition: transform .2s ease;
  animation: rc-tint 1.3s cubic-bezier(.3,.7,.2,1) var(--d, 0s) both; }
@keyframes rc-tint { from { --rc-h: 200; --rc-c: 0.085; --rc-l: 0.53; } }
.rc.off { --rc-c: 0.008; --rc-l: 0.44; background: var(--rc); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.22); }
.rc-top { display: flex; justify-content: space-between; gap: 4px; width: 100%; min-width: 0; font-family: var(--mono); font-size: 8.5px; letter-spacing: .05em; text-transform: uppercase; opacity: .92; position: relative; z-index: 3; }
.rc-top span:first-child { flex: none; white-space: nowrap; }
.rc-top span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-face { position: relative; width: 74%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; z-index: 1; box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
.rc-face img { display: block; width: 100%; height: 100%; object-fit: cover; }
.rc.off .rc-face img { filter: saturate(.55); }
.rc-name { font-family: var(--serif); font-size: 13px; line-height: 1.1; position: relative; z-index: 3; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.rc.score .rc-face { box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 0 16px 3px oklch(0.86 0.14 var(--rc-hue, 200) / .85);
  animation: rc-halo 2.6s ease-in-out calc(var(--d, 0s) + 1.3s) infinite alternate; }
.rc.score .rc-face::after { content: ""; position: absolute; inset: -25%; pointer-events: none;
  background: linear-gradient(105deg, transparent 36%, rgba(255,255,255,.8) 48%, transparent 60%); translate: -130% 0;
  animation: rc-sheen 3.4s ease-in-out calc(var(--d, 0s) + 1.4s) infinite; }
@keyframes rc-halo { to { box-shadow: 0 0 0 2px #fff, 0 0 26px 7px oklch(0.9 0.16 var(--rc-hue, 200) / .95); } }
@keyframes rc-sheen { 0% { translate: -130% 0; } 45%, 100% { translate: 130% 0; } }
.rc-foil, .rc-sparks, .rc-glare { position: absolute; pointer-events: none; border-radius: inherit; opacity: 0; }
.rc-foil { inset: 0; z-index: 0; mix-blend-mode: overlay;
  background: repeating-linear-gradient(115deg, #ff5fa2 0%, #ffd23f 4%, #4dffa6 8%, #3fc8ff 12%, #9b6bff 16%, #ff5fa2 20%),
              repeating-linear-gradient(25deg, transparent 0 5px, rgba(255,255,255,.25) 5px 6px);
  background-size: 260% 260%, auto; background-position: var(--mx, 0%) var(--my, 50%), 0 0;
  animation: rc-foil-in .8s ease calc(var(--d, 0s) + 1.1s) forwards, rc-shimmer 7s ease-in-out calc(var(--d, 0s) + 1.9s) infinite; }
.rc-sparks { inset: 0; z-index: 0;
  background: radial-gradient(circle, rgba(255,255,255,.95) 0 1px, transparent 1.6px) 0 0 / 14px 14px,
              radial-gradient(circle, rgba(255,255,255,.8) 0 .8px, transparent 1.4px) 7px 9px / 19px 19px;
  -webkit-mask-image: linear-gradient(115deg, transparent 20%, #000 45%, transparent 70%); mask-image: linear-gradient(115deg, transparent 20%, #000 45%, transparent 70%);
  -webkit-mask-size: 300% 300%; mask-size: 300% 300%; animation: rc-foil-in .8s ease calc(var(--d, 0s) + 1.1s) forwards; }
.rc-glare { inset: -50%; z-index: 2; mix-blend-mode: soft-light;
  background: radial-gradient(circle at var(--gx, 40%) var(--gy, 35%), rgba(255,255,255,.95), rgba(255,255,255,0) 22%);
  animation: rc-glare-in .8s ease calc(var(--d, 0s) + 1.1s) forwards, rc-drift 7s ease-in-out calc(var(--d, 0s) + 1.9s) infinite; }
@keyframes rc-foil-in { to { opacity: .42; } }
@keyframes rc-glare-in { to { opacity: .6; } }
@keyframes rc-shimmer { 0%, 100% { background-position: 0% 40%, 0 0; } 50% { background-position: 100% 60%, 0 0; } }
@keyframes rc-drift { 0%, 100% { translate: -14% -10%; } 50% { translate: 14% 10%; } }
.rc.score { touch-action: none; cursor: grab; }
.rc.live .rc-foil { animation: none; opacity: .58; }
.rc.live .rc-glare { animation: none; opacity: .75; translate: 0 0; }
.rc-state { display: grid; gap: 4px; margin-top: 8px; }
.rc-tag { justify-self: start; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; padding: 2px 9px; border-radius: 999px; }
.rc-tag.score { color: #fff; background: linear-gradient(100deg, oklch(0.5 0.12 var(--rc-hue, 200)), oklch(0.56 0.12 calc(var(--rc-hue, 200) + 40))); }
.rc-tag.off { color: var(--ink-2); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
/* Vignette de la carte sur les pages du recueil (Mon deck) : même code, sans animation permanente */
.rc.mini { width: 54px; padding: 4px; border-radius: 7px; grid-template-rows: 1fr; animation: none; transform: none; cursor: inherit; touch-action: auto; }
.rc.mini .rc-top, .rc.mini .rc-name { display: none; }
.rc.mini .rc-face { width: 82%; animation: none; }
.rc.mini .rc-face::after { animation: none; display: none; }
.rc.mini .rc-foil, .rc.mini .rc-sparks { animation: none; opacity: .4; }
.rc.mini .rc-glare { animation: none; opacity: .5; }
.folio:hover .rc.mini .rc-foil { animation: rc-shimmer 5s ease-in-out infinite; }
.folio .hand-wrap { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.folio .sc-line { font-family: var(--fell); font-style: italic; font-size: 13px; color: var(--iron-2); }
.folio .sc-line.score::before { content: "✦ "; font-style: normal; }

/* ---------- Révélation groupée : on tire les cartes d'affilée, les candidats se révèlent par lots de 5 ---------- */
.lot-h { font-family: var(--serif); font-size: 22px; margin: 0; }
.lot { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.lot-it { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: center; }
.lot-card { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 10px; }
.flip { display: block; width: 84px; aspect-ratio: 5 / 7; perspective: 700px; }
.flip-in { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; animation: lot-flip .75s cubic-bezier(.3,.7,.2,1) var(--f, 0s) both; }
@keyframes lot-flip { from { transform: rotateY(0deg); } to { transform: rotateY(180deg); } }
.flip-back, .flip-front { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 9px; }
.flip-front { transform: rotateY(180deg); }
.flip-back { background: var(--deck); display: grid; place-items: center; align-content: center; gap: 6px; color: var(--on-deck); font-family: var(--mono); font-size: 9px; letter-spacing: .06em; box-shadow: inset 0 0 0 3px color-mix(in oklab, var(--surface) 30%, transparent); }
.flip-back i { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in oklab, var(--surface) 92%, var(--deck)); }
.flip-back svg { width: 22px; height: 22px; stroke: var(--deck); }
.flip-front .rc { width: 100%; height: 100%; padding: 5px 5px 6px; border-radius: 9px; }
.flip-front .rc-top { font-size: 7px; }
.flip-front .rc-name { font-size: 11px; }
.lot.still .flip-in { animation: none; transform: rotateY(180deg); }
.lot.still .rc, .lot.still .rc * { animation-delay: 0s !important; }
.lot-tx { display: grid; gap: 3px; min-width: 0; animation: lot-tx .45s ease calc(var(--f, 0s) + .45s) both; }
@keyframes lot-tx { from { opacity: 0; transform: translateX(8px); } }
.lot.still .lot-tx { animation: none; }
.lot-tx b { font-family: var(--serif); font-size: 17px; font-weight: 700; }
.lot-tx .fine { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lot-tx .badge { justify-self: start; }
.sc-mini { font-size: 11.5px; font-weight: 700; }
.sc-mini.score { color: var(--d-ok); } .sc-mini.off { color: var(--muted); font-weight: 600; }
.lot-acts { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 2px; }
.lnk { border: 0; background: none; padding: 0; color: var(--link); font-size: 12.5px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.lot-gal { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 10px; }
.lot-gal b { color: var(--deck); }
.folio .author.pend { font-family: var(--fell); font-style: italic; font-size: 15px; color: var(--iron-2); }
@media (prefers-reduced-motion: reduce) { .flip-in { animation: none; transform: rotateY(180deg); } .lot-tx { animation: none; } }
@media (prefers-reduced-motion: reduce) {
  .rc, .rc-foil, .rc-sparks, .rc-glare, .rc-face, .rc-face::after { animation: none !important; transition: none !important; }
  .rc { transform: none !important; }
  .rc.score .rc-foil, .rc.score .rc-sparks { opacity: .42; } .rc.score .rc-glare { opacity: .6; }
  .rc.score .rc-face::after { display: none; }
}
blockquote { margin: 0; font-family: var(--serif); font-size: 16px; font-style: italic; border-left: 3px solid var(--deck); padding-left: 12px; }
.sides { display: grid; gap: 10px; }
.side { display: grid; gap: 6px; }
.side .lab { font-size: 12px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.person { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px 2px 2px; font-size: 12.5px; }
.person img { width: 22px; height: 22px; border-radius: 50%; }
.person i { font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.person.me { border-color: var(--deck); box-shadow: inset 0 0 0 1px var(--deck); }
.person.retire, .row.retire { opacity: .55; }
.person.retire img, .row.retire img { filter: grayscale(1); }
.st-pill { display: inline-flex; align-items: center; gap: 4px; font-family: var(--sans); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; vertical-align: middle; white-space: nowrap; }
.st-pill.retire { background: color-mix(in oklab, var(--muted) 18%, transparent); color: var(--muted); border: 1px solid color-mix(in oklab, var(--muted) 40%, transparent); }
.st-pill.vainqueur { background: transparent; color: var(--st-win); border: 1.5px solid currentColor; }
.nm .st-pill { justify-self: start; }
.mini .st-pill { white-space: normal; max-width: 100%; justify-self: start; font-size: 9.5px; padding: 1px 6px; }

textarea { box-sizing: border-box; width: 100%; min-height: 90px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; background: var(--page); color: var(--ink); }

.choice4 button[aria-pressed="true"] { background: currentColor; }
.choice4 button[aria-pressed="true"] span { color: var(--surface); }

.overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px)); background: radial-gradient(120% 80% at 50% 10%, color-mix(in oklab, var(--deck) 45%, #04191c), #031113); color: #EAF6F5; }
.ob { max-width: 420px; width: 100%; display: grid; gap: 18px; text-align: center; }

.tri .res img { width: 76px; height: 76px; border-radius: 50%; box-shadow: 0 0 0 4px var(--deck); }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 14px); translate: -50% 0; z-index: 40; background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.3); }

@media (prefers-reduced-motion: reduce) {
  :root { transition: none; }
  .card.anim, .bar i { transition: none; }
